description: >
  Turbo / auto-fire: while held, repeatedly press and release a keycode.
  Stops immediately when released. Delays can be fixed or random within a range.

compatible: "zmk,behavior-turbo-key"

include: one_param.yaml

properties:
  tap-ms-min:
    type: int
    default: 20
    description: Minimum duration of each synthetic key press (ms)
  tap-ms-max:
    type: int
    default: 20
    description: >
      Maximum duration of each synthetic key press (ms).
      If equal to tap-ms-min, press length is fixed.
  wait-ms-min:
    type: int
    default: 50
    description: Minimum gap between releasing a key and the next press (ms)
  wait-ms-max:
    type: int
    default: 50
    description: >
      Maximum gap between releasing a key and the next press (ms).
      If equal to wait-ms-min, the gap is fixed. If greater, each gap is random in [min, max].
